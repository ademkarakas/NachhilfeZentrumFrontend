<!doctype html>
<html lang="de" data-theme="light">
<head>
  <meta charset="utf-8">
  <title>Nachhilfezentrum — Nachhilfe & Coaching</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#157f5c" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#14110e" media="(prefers-color-scheme: dark)">
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <!-- Prevent theme flash: resolve the stored/system theme before first paint. -->
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('nz-theme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var dark = stored === 'dark' || ((!stored || stored === 'system') && prefersDark);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      } catch (e) {}
    })();
  </script>

  <!-- Web fonts: Fraunces (warm display serif) + Plus Jakarta Sans (humanist body). -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
  >

  <link rel="preconnect" href="http://localhost:5009">
</head>
<body>
  <app-root></app-root>
</body>
</html>
