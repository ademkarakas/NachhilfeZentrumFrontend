<header class="page-head">
  <h1>FAQ</h1>
  <button mat-flat-button color="primary" (click)="create()">Neue FAQ</button>
</header>

@if (items().length === 0) {
  <p class="admin-empty">Noch keine FAQ-Einträge angelegt.</p>
} @else {
  <table
    mat-table
    [dataSource]="items()"
    cdkDropList
    (cdkDropListDropped)="drop($event)"
    class="admin-table"
  >
    <ng-container matColumnDef="order">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let f" class="drag-handle" cdkDrag cdkDragHandle>☰</td>
    </ng-container>
    <ng-container matColumnDef="question">
      <th mat-header-cell *matHeaderCellDef>Frage</th>
      <td mat-cell *matCellDef="let f" class="question-cell">{{ f.question }}</td>
    </ng-container>
    <ng-container matColumnDef="category">
      <th mat-header-cell *matHeaderCellDef>Kategorie</th>
      <td mat-cell *matCellDef="let f">{{ f.category || '—' }}</td>
    </ng-container>
    <ng-container matColumnDef="published">
      <th mat-header-cell *matHeaderCellDef>Sichtbar</th>
      <td mat-cell *matCellDef="let f">{{ f.isPublished ? 'Ja' : 'Nein' }}</td>
    </ng-container>
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let f" class="actions">
        <button mat-button (click)="edit(f)">Bearbeiten</button>
        <button mat-button color="warn" (click)="remove(f)">Löschen</button>
      </td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="columns"></tr>
    <tr mat-row *matRowDef="let row; columns: columns" cdkDrag></tr>
  </table>
}
