<div class="page-head">
  <h1>Benutzerverwaltung</h1>
  <button mat-flat-button color="primary" (click)="openCreate()">
    <mat-icon>person_add</mat-icon>
    Neuer Benutzer
  </button>
</div>

<table mat-table [dataSource]="users()" class="admin-table mat-elevation-z1">
  <ng-container matColumnDef="fullName">
    <th mat-header-cell *matHeaderCellDef>Name</th>
    <td mat-cell *matCellDef="let u">{{ u.fullName }}</td>
  </ng-container>

  <ng-container matColumnDef="email">
    <th mat-header-cell *matHeaderCellDef>E-Mail</th>
    <td mat-cell *matCellDef="let u">{{ u.email }}</td>
  </ng-container>

  <ng-container matColumnDef="roles">
    <th mat-header-cell *matHeaderCellDef>Rolle</th>
    <td mat-cell *matCellDef="let u">
      <mat-chip-set>
        @for (role of u.roles; track role) {
          <mat-chip>{{ role }}</mat-chip>
        }
      </mat-chip-set>
    </td>
  </ng-container>

  <ng-container matColumnDef="status">
    <th mat-header-cell *matHeaderCellDef>Status</th>
    <td mat-cell *matCellDef="let u">
      @if (u.isActive) {
        <span class="badge badge--active">Aktiv</span>
      } @else {
        <span class="badge badge--inactive">Deaktiviert</span>
      }
    </td>
  </ng-container>

  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef></th>
    <td mat-cell *matCellDef="let u">
      <div class="actions-cell">
        <mat-select
          [value]="getBackOfficeRole(u)"
          (selectionChange)="changeRole(u, $event.value)"
          class="role-select"
        >
          <mat-option value="Admin">Admin</mat-option>
          <mat-option value="Editor">Editor</mat-option>
        </mat-select>
        @if (u.isActive) {
          <button mat-icon-button color="warn" (click)="deactivate(u)" title="Deaktivieren">
            <mat-icon>block</mat-icon>
          </button>
        } @else {
          <button mat-icon-button color="primary" (click)="reactivate(u)" title="Reaktivieren">
            <mat-icon>check_circle</mat-icon>
          </button>
        }
      </div>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="columns"></tr>
  <tr mat-row *matRowDef="let row; columns: columns"></tr>
</table>
