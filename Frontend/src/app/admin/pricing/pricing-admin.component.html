<header class="page-head">
  <h1>Preise</h1>
  <button mat-flat-button color="primary" (click)="create()">Neues Preispaket</button>
</header>

@if (items().length === 0) {
  <p class="admin-empty">Noch keine Preispakete angelegt.</p>
} @else {
  <table
    mat-table
    [dataSource]="items()"
    cdkDropList
    (cdkDropListDropped)="drop($event)"
    class="admin-table"
  >
    <ng-container matColumnDef="order">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let t" class="drag-handle" cdkDrag cdkDragHandle>☰</td>
    </ng-container>
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Name</th>
      <td mat-cell *matCellDef="let t">{{ t.name }}</td>
    </ng-container>
    <ng-container matColumnDef="price">
      <th mat-header-cell *matHeaderCellDef>Preis</th>
      <td mat-cell *matCellDef="let t">{{ t.price }}</td>
    </ng-container>
    <ng-container matColumnDef="highlighted">
      <th mat-header-cell *matHeaderCellDef>Hervorgehoben</th>
      <td mat-cell *matCellDef="let t">{{ t.isHighlighted ? 'Ja' : 'Nein' }}</td>
    </ng-container>
    <ng-container matColumnDef="published">
      <th mat-header-cell *matHeaderCellDef>Sichtbar</th>
      <td mat-cell *matCellDef="let t">{{ t.isPublished ? 'Ja' : 'Nein' }}</td>
    </ng-container>
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let t" class="actions">
        <button mat-button (click)="edit(t)">Bearbeiten</button>
        <button mat-button color="warn" (click)="remove(t)">Löschen</button>
      </td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="columns"></tr>
    <tr mat-row *matRowDef="let row; columns: columns" cdkDrag></tr>
  </table>
}
