
<h2 mat-dialog-title>Profil bearbeiten</h2>
<form [formGroup]="form" (ngSubmit)="save()">
  <mat-dialog-content class="form-grid">
    <mat-form-field appearance="outline">
      <mat-label>Vollständiger Name</mat-label>
      <input matInput formControlName="fullName" />
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>E-Mail</mat-label>
      <input matInput formControlName="email" type="email" />
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Aktuelles Passwort</mat-label>
      <input matInput formControlName="currentPassword" type="password" />
      <mat-hint>Nur erforderlich bei Passwortänderung</mat-hint>
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Neues Passwort</mat-label>
      <input matInput formControlName="newPassword" type="password" />
    </mat-form-field>
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-button type="button" [mat-dialog-close]="undefined">Abbrechen</button>
    <button mat-flat-button color="primary" type="submit" [disabled]="form.invalid || saving()">
      Speichern
    </button>
  </mat-dialog-actions>
</form>
